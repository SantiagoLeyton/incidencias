<!doctype html><html lang="es"><meta charset="utf-8"><title>{{ label }}</title><body>
<h1>{{ label }}</h1><table border="1" cellpadding="6"><tr><th>HOJA</th><th>FILA</th><th>CONTEXTO</th><th>INFORMACIÓN ENCONTRADA</th><th>DESCRIPCIÓN</th><th>ACCIÓN</th></tr>
{% for inc in incidents %}<tr><td>{{ inc.sheet }}</td><td>{{ inc.row or '—' }}</td><td>{{ inc.context }}</td><td>{% for line in inc.info %}<div>{{ line }}</div>{% endfor %}</td><td>{{ inc.description }}</td><td><a href="{{ url_for('detail',token=token,incident_id=inc.id) }}">VER DETALLES</a></td></tr>{% endfor %}</table>
<p><a href="{{ url_for('groups',token=token) }}">Volver a grupos</a></p></body></html>
